# Ports are parameterised so two checkouts can run side by side. The
# reproducibility clone uses alternate ports; a collision otherwise looks
# like a broken setup when it is only a busy one.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statesync
      POSTGRES_PASSWORD: statesync
      POSTGRES_DB: statesync
    ports:
      - "${STATESYNC_PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statesync -d statesync"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${STATESYNC_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
