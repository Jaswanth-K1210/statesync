services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statesync
      POSTGRES_PASSWORD: statesync
      POSTGRES_DB: statesync
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statesync -d statesync"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
